      [TEXT] #1418:32457 layout=layout_56d3c81c fills=fill_34dc0314 textStyle=Mobile/Heading/H2 text="Как выбрать подарок для дома, который не будет случайным"
    [FRAME] #1418:32734 layout={"mode":"column","alignSelf":"stretch","padding":"0px 16px 50px","alignItems":"stretch","gap":"20px","sizing":{"horizontal":"fill","vertical":"hug"}}
      [TEXT] #1418:32735 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=Mobile/Text/T2 text="Подарок для дома кажется простым выбором только на первый взгляд. Посуда, ваза, плед или декоративный предмет могут быть очень личными: они становятся частью пространства, попадают в привычный ритм жизни и каждый день оказываются на виду.\\nПоэтому хороший подарок для дома — это не просто красивая вещь. Он должен быть уместным по стилю, понятным по назначению и достаточно универсальным, чтобы легко вписаться в интерьер."
