  textStyle: style_9a5f131c
  fills: fill_8b4fbb9e
EL-f1ef2d68:
  type: TEXT
  layout: layout_56d3c81c
  text: 'Для дня рождения подойдут более личные предметы: чайная пара, ваза, текстиль или аксессуар для сервировки. Для свадьбы или новоселья лучше выбирать вещи, которые могут стать частью общего пространства: сервиз, набор бокалов, предмет декора или подарочный сертификат.\nДля делового подарка особенно важны сдержанность и качество исполнения. Здесь хорошо работают лаконичные предметы известных брендов: хрусталь, настольные аксессуары, декоративные объекты или универсальные изделия для сервировки.'
  textStyle: Mobile/Text/T2
  fills: fill_95f554d6
EL-57b13f65:
  type: TEXT
  layout: layout_177c5efc
  text: Учитывайте интерьер
  textStyle: Tablet/Heading/H3
  fills: fill_34dc0314
EL-3d94a82f:
  type: TEXT
  layout: layout_56d3c81c
  text: "Даже самый красивый предмет может выглядеть случайно, если он\_не\_совпадает с\_атмосферой дома. Перед покупкой стоит подумать о\_цветах, материалах и\_общем характере пространства.\\nДля спокойного интерьера подойдут изделия с\_чистыми формами, хрусталём, фарфором, прозрачным стеклом или мягкими оттенками. Для более выразительного пространства можно выбрать предмет с\_акцентным цветом, фактурой или узнаваемым рисунком бренда."
  textStyle: Mobile/Text/T2
  fills: fill_95f554d6
EL-59600fdd:
  type: TEXT
  layout:
    mode: none
    sizing:
      horizontal: fixed
      vertical: hug
    dimensions:
      width: 300.84
  text: Подарочная карта Luvr подойдёт, если хочется оставить получателю возможность выбрать изделие самостоятельно
  textStyle: Mobile/Text/T2
  fills: fill_95f554d6
EL-2d7ea6e3:
  type: TEXT
  layout: layout_177c5efc
  text: Обращайте внимание на упаковку
  textStyle: Tablet/Heading/H3
  fills: fill_34dc0314
EL-dfbcb929:
  type: TEXT
  layout: layout_56d3c81c
  text: "Если подарок нужно вручить лично, упаковка становится частью впечатления. Оригинальная коробка, фирменный пакет, лента и\_аккуратная подготовка делают подарок завершённым.\\nВ\_Luvr перед покупкой можно уточнить комплектацию изделия, наличие упаковки и\_детали, которые важны для подарка."
  textStyle: Mobile/Text/T2
  fills: fill_95f554d6

