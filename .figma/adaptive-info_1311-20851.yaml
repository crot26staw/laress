          [FRAME] "Content" #1311:21197 template=EL-5e8ff676
            [TEXT] #1311:21198 layout=layout_177c5efc fills=fill_34dc0314 textStyle=H3 text="Способы оплаты:"
            [TEXT] #1311:21199 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_7144fd46 text="  - Банковской картой на сайте\\n  - СБП\\n  - QR-кодом\\n  - На расчётный счёт \\(+10% к стоимости заказа\\)"
