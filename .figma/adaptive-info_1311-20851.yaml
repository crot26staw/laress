        [TEXT] #1311:21169 layout=layout_f393722d fills=fill_34dc0314 textStyle=H2 text="Доставка и оплата"
        [TEXT] #1311:21170 layout=layout_6b44f93e fills=fill_95f554d6 textStyle=style_408c8505 text="Мы выкупаем и доставляем изделия под заказ. Сопровождаем товар на каждом этапе: выкупаем позицию у бренда, организуем доставку и таможенное оформление товара"
    [FRAME] "Delivery" #1311:21171 layout={"mode":"column","alignSelf":"stretch","padding":"0px 40px","alignItems":"stretch","gap":"32px","sizing":{"horizontal":"fill","vertical":"hug"}}
      [FRAME] "Cards" #1311:21172 layout={"mode":"row","alignSelf":"stretch","alignItems":"stretch","gap":"20px","sizing":{"horizontal":"fill","vertical":"hug"}}
        [FRAME] "Moscow" #1311:21173 template=EL-8d2f7a65
          [TEXT] #1311:21174 layout=layout_177c5efc fills=fill_34dc0314 textStyle=H3 text="Москва"
          [TEXT] #1311:21175 layout={"mode":"none","sizing":{"horizontal":"fixed","vertical":"hug"},"dimensions":{"width":527.46}} fills=fill_95f554d6 textStyle=style_7144fd46 text="После доставки изделия к нам на склад, наш менеджер связывается с вами и согласовывает дату и время доставки"
          [TEXT] #1311:21176 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_7144fd46 text="  - Доставка бесплатная"
        [FRAME] "Other" #1311:21177 template=EL-8d2f7a65
          [TEXT] #1311:21178 layout=layout_177c5efc fills=fill_34dc0314 textStyle=H3 text="Россия и зарубежье"
          [TEXT] #1311:21179 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_7144fd46 boldWeight=700 text="Доставка осуществляется удобной для покупателя транспортной компанией по её тарифам. Сроки доставки зависят от поставки товара, бренда и адреса получения и согласовываются с менеджером.\\n{ts2}**Обратите внимание:**{/ts2} при отказе от товара стоимость доставки оплачивается покупателем."
    [FRAME] "In stock" #1311:21180 layout={"mode":"row","alignSelf":"stretch","padding":"70px 0px","alignItems":"center","sizing":{"horizontal":"fill","vertical":"hug"}}
      [FRAME] #1311:21181 layout={"mode":"column","alignSelf":"stretch","padding":"0px 20px 0px 40px","justifyContent":"flex-end","gap":"24px","sizing":{"horizontal":"fill","vertical":"fill"}}
        [FRAME] #1311:21182 template=EL-3e88f878
          [TEXT] #1311:21183 layout={"mode":"none","sizing":{"horizontal":"fixed","vertical":"hug"},"dimensions":{"width":658}} fills=fill_34dc0314 textStyle={"fontFamily":"Hauora","fontStyle":"Regular","fontWeight":400,"fontSize":18,"lineHeight":"1.25em","letterSpacing":"-0.02em","textAlignHorizontal":"LEFT","textAlignVertical":"TOP","paragraphSpacing":14,"listSpacing":14} text="Все изделия оформляются под заказ, поэтому при оформлении необходимо внести предоплату в размере 30% стоимости изделия . При оформлении заказа заключается официальный договор.\\nСрок поставки зависит от бренда и обычно составляет  от 2 недель до 2 месяцев. Точные сроки менеджер сообщит  при оформлении заказа."
        [FRAME] #1311:21184 template=EL-2109c031
