        [TEXT] #1418:31747 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_b193a44d boldWeight=700 text="  - Испытательный срок — 1 месяц.\\n  - Оклад {ts4}**3 000 ₽/выход + 2% с продаж**{/ts4}.\\n  - Гарантированный доход {ts4}**от 100 000 ₽**{/ts4} в месяц \\(обсуждается индивидуально\\).\\n  - Зарплата — 2 раза в месяц.\\n  - График работы:{ts4} **2/2, с 10:00 до 22:00**{/ts4} \\(обсуждается на собеседовании\\).\\n  - Место работы: {ts4}**ТЦ «Юнимолл»**{/ts4}; бесплатный транспорт от м. Крылатское.\\n  - Возможен карьерный рост с увеличением заработной платы."
      [FRAME] "Moscow" #1418:31748 template=EL-b3464ddb
        [TEXT] #1418:31749 layout=layout_177c5efc fills=fill_34dc0314 textStyle=Mobile/Heading/H3 text="Обязанности:"
        [TEXT] #1418:31750 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_b193a44d text="  - Встреча клиентов в шоуруме, демонстрация товара.\\n  - Консультирование по наличию и оформлению предзаказов с сайта.\\n  - Обработка входящих интернет‑заказов \\(сайт, телефон, почта, чаты, WhatsApp\\).\\n  - Без холодных звонков.\\n  - Взаимодействие с курьерскими службами.\\n  - Выставление счётов, контроль оплаты.\\n  - Выполнение поручений руководителя.\\n  - Добавление и редактирование карточек товаров \\(в штате есть администратор сайта\\).\\n  - Работа с товаром: приём, инвентаризация, порядок на складе.\\n  - Знание «МойСклад» приветствуется."
