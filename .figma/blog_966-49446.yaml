        [TEXT] #966:49543 layout={"mode":"none","sizing":{"horizontal":"fixed","vertical":"hug"},"dimensions":{"width":708}} fills=fill_34dc0314 textStyle=H2 text="Как выбрать подарок для дома, который не будет случайным"
    [FRAME] #966:49544 layout={"mode":"column","alignSelf":"stretch","padding":"0px 268px 70px","alignItems":"stretch","gap":"28px","sizing":{"horizontal":"fill","vertical":"hug"}}
      [TEXT] #966:49545 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_c1e78652 text="Подарок для дома кажется простым выбором только на первый взгляд. Посуда, ваза, плед или декоративный предмет могут быть очень личными: они становятся частью пространства, попадают в привычный ритм жизни и каждый день оказываются на виду.\\nПоэтому хороший подарок для дома — это не просто красивая вещь. Он должен быть уместным по стилю, понятным по назначению и достаточно универсальным, чтобы легко вписаться в интерьер."
      [FRAME] "Image" #966:49546 layout=layout_9308889f fills=[{"type":"IMAGE","imageRef":"058c1d8455902d4feeae548f64370c6e21211db7","scaleMode":"FILL","objectFit":"cover","isBackground":false,"imageDownloadArguments":{"needsCropping":false,"requiresImageDimensions":false}},"#B1B1B1"]
      [FRAME] #966:49547 template=EL-50ef8a26
        [TEXT] #966:49548 layout=layout_177c5efc fills=fill_34dc0314 textStyle=H3 text="Начните с повода"
        [TEXT] #966:49549 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_c1e78652 text="Для дня рождения подойдут более личные предметы: чайная пара, ваза, текстиль или аксессуар для сервировки. Для свадьбы или новоселья лучше выбирать вещи, которые могут стать частью общего пространства: сервиз, набор бокалов, предмет декора или подарочный сертификат.\\nДля делового подарка особенно важны сдержанность и качество исполнения. Здесь хорошо работают лаконичные предметы известных брендов: хрусталь, настольные аксессуары, декоративные объекты или универсальные изделия для сервировки."
      [FRAME] "Image" #966:49550 layout=layout_9308889f fills=[{"type":"IMAGE","imageRef":"013d49a8edd78e5ec3ad22e6534d313e56c35c80","scaleMode":"FILL","objectFit":"cover","isBackground":false,"imageDownloadArguments":{"needsCropping":false,"requiresImageDimensions":false}},{"type":"IMAGE","imageRef":"058c1d8455902d4feeae548f64370c6e21211db7","scaleMode":"FILL","objectFit":"cover","isBackground":false,"imageDownloadArguments":{"needsCropping":false,"requiresImageDimensions":false}},"#B1B1B1"]
      [FRAME] #966:49551 template=EL-50ef8a26
        [TEXT] #966:49552 layout=layout_177c5efc fills=fill_34dc0314 textStyle=H3 text="Учитывайте интерьер"
        [TEXT] #966:49553 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_c1e78652 text="Даже самый красивый предмет может выглядеть случайно, если он не совпадает с атмосферой дома. Перед покупкой стоит подумать о цветах, материалах и общем характере пространства.\\nДля спокойного интерьера подойдут изделия с чистыми формами, хрусталём, фарфором, прозрачным стеклом или мягкими оттенками. Для более выразительного пространства можно выбрать предмет с акцентным цветом, фактурой или узнаваемым рисунком бренда."
      [FRAME] "Image" #966:49554 layout={"mode":"row","alignSelf":"stretch","padding":"24px","justifyContent":"center","alignItems":"center","gap":"24px","sizing":{"horizontal":"fill","vertical":"hug"}} fills=["#D6C5AA"]
        [FRAME] "Text" #966:49555 layout={"mode":"column","alignSelf":"stretch","justifyContent":"space-between","sizing":{"horizontal":"fill","vertical":"fill"}}
          [FRAME] #966:49556 template=EL-50ef8a26
            [TEXT] #966:49557 layout=layout_177c5efc fills=fill_34dc0314 textStyle="H2 (828:11795)" text="Подарите выбор"
            [TEXT] #966:49558 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=T2 text="Подарочная карта Luvr подойдёт, если хочется оставить получателю возможность выбрать изделие самостоятельно"
          [INSTANCE] #966:49559 template=EL-18fca13c
            [TEXT] #I966:49559;1:6200 layout=layout_177c5efc fills=fill_658ab2fa textStyle=style_ce0a4cea text="Купить подарочную карту"
        [FRAME] "Image" #966:49560 layout={"mode":"column","justifyContent":"center","alignItems":"center","gap":"10px","sizing":{"horizontal":"fill","vertical":"fixed"},"dimensions":{"height":268}} fills=[{"type":"IMAGE","imageRef":"15d29905f621b4d116c3923f0e503fbb05ee91f7","scaleMode":"FILL","objectFit":"cover","isBackground":false,"imageDownloadArguments":{"needsCropping":false,"requiresImageDimensions":false}},"#B1B1B1"]
      [FRAME] "Image" #966:49561 layout=layout_9308889f fills=[{"type":"IMAGE","imageRef":"a2f05d126b72507ffb34c96355f26dbbe2d7c17b","scaleMode":"FILL","objectFit":"cover","isBackground":false,"imageDownloadArguments":{"needsCropping":false,"requiresImageDimensions":false}},{"type":"IMAGE","imageRef":"6e7b408207da980f53569e61db687c9547a13257","scaleMode":"FILL","objectFit":"cover","isBackground":false,"imageDownloadArguments":{"needsCropping":false,"requiresImageDimensions":false}},{"type":"IMAGE","imageRef":"058c1d8455902d4feeae548f64370c6e21211db7","scaleMode":"FILL","objectFit":"cover","isBackground":false,"imageDownloadArguments":{"needsCropping":false,"requiresImageDimensions":false}},"#B1B1B1"]
      [FRAME] #966:49562 template=EL-50ef8a26
        [TEXT] #966:49563 layout=layout_177c5efc fills=fill_34dc0314 textStyle=H3 text="Обращайте внимание на упаковку"
        [TEXT] #966:49564 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_c1e78652 text="Если подарок нужно вручить лично, упаковка становится частью впечатления. Оригинальная коробка, фирменный пакет, лента и аккуратная подготовка делают подарок завершённым.\\nВ Luvr перед покупкой можно уточнить комплектацию изделия, наличие упаковки и детали, которые важны для подарка."
