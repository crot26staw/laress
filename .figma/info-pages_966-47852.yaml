    [FRAME] #966:48423 layout={"mode":"row","padding":"0px 0px 70px","gap":"20px","sizing":{"horizontal":"hug","vertical":"hug"}}
      [FRAME] #966:48424 layout={"mode":"column","gap":"12px","sizing":{"horizontal":"fixed","vertical":"hug"},"dimensions":{"width":672}}
        [FRAME] "Other" #966:48425 layout={"mode":"column","padding":"32px","gap":"16px","sizing":{"horizontal":"fixed","vertical":"hug"},"dimensions":{"width":672}} fills=fill_860a2344
          [TEXT] #966:48426 layout=layout_177c5efc fills=fill_34dc0314 textStyle=H3 text="Требования:"
          [TEXT] #966:48427 layout=layout_177c5efc fills=fill_95f554d6 textStyle=style_7144fd46 boldWeight=700 text="  - {ts3}Грамотная письменная и устная речь.{/ts3}\\n  - {ts3}Чувство вкуса и стиля.{/ts3}\\n  - {ts3}Умение работать в условиях многозадачности.{/ts3}\\n  - {ts3}Организационные навыки и уверенные продажи.{/ts3}\\n  - {ts3}Коммуникабельность, ответственность.{/ts3}\\n  - {ts3}Уверенный пользователь {/ts3}{ts4}**MacOS**{/ts4}{ts3} и{/ts3}{ts4} **iPhone**{/ts4}{ts3} — обязательно.{/ts3}"
        [FRAME] "Moscow" #966:48428 layout={"mode":"column","padding":"32px","justifyContent":"center","gap":"16px","sizing":{"horizontal":"fixed","vertical":"hug"},"dimensions":{"width":672}} fills=fill_860a2344
          [TEXT] #966:48429 layout=layout_177c5efc fills=fill_34dc0314 textStyle=H3 text="Условия:"
          [TEXT] #966:48430 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_7144fd46 boldWeight=700 text="  - {ts3}Испытательный срок — 1 месяц.{/ts3}\\n  - {ts3}Оклад {/ts3}{ts4}**3 000 ₽/выход + 2% с продаж**{/ts4}{ts3}.{/ts3}\\n  - {ts3}Гарантированный доход {/ts3}{ts4}**от 100 000 ₽**{/ts4}{ts3} в месяц \\(обсуждается индивидуально\\).{/ts3}\\n  - {ts3}Зарплата — 2 раза в месяц.{/ts3}\\n  - {ts3}График работы:{/ts3}{ts4} **2/2, с 10:00 до 22:00**{/ts4}{ts3} \\(обсуждается на собеседовании\\).{/ts3}\\n  - {ts3}Место работы: {/ts3}{ts4}**ТЦ «Юнимолл»**{/ts4}{ts3}; бесплатный транспорт от м. Крылатское.{/ts3}\\n  - {ts3}Возможен карьерный рост с увеличением заработной платы.{/ts3}"
      [FRAME] "Moscow" #966:48431 layout={"mode":"column","padding":"32px","gap":"16px","sizing":{"horizontal":"fixed","vertical":"fixed"},"dimensions":{"width":672,"height":634}} fills=fill_860a2344
        [TEXT] #966:48432 layout=layout_177c5efc fills=fill_34dc0314 textStyle=H3 text="Обязанности:"
        [TEXT] #966:48433 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_7144fd46 text="  - Встреча клиентов в шоуруме, демонстрация товара.\\n  - Консультирование по наличию и оформлению предзаказов с сайта.\\n  - Обработка входящих интернет‑заказов \\(сайт, телефон, почта, чаты, WhatsApp\\).\\n  - Без холодных звонков.\\n  - Взаимодействие с курьерскими службами.\\n  - Выставление счетов, контроль оплаты.\\n  - Выполнение поручений руководителя.\\n  - Добавление и редактирование карточек товаров \\(в штате есть администратор сайта\\).\\n  - Работа с товаром: приём, инвентаризация, порядок на складе.\\n  - Знание «МойСклад» приветствуется."
