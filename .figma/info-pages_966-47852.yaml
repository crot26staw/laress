          [LINE] #966:48260 template=EL-56ff9324
        [TEXT] #966:48261 layout=layout_f393722d fills=fill_34dc0314 textStyle=H2 text="Доставка и оплата"
        [TEXT] #966:48262 layout=layout_6b44f93e fills=fill_95f554d6 textStyle=style_408c8505 text="Мы выкупаем и доставляем изделия под заказ. Сопровождаем товар на каждом этапе: выкупаем позицию у бренда, организуем доставку и таможенное оформление товара"
    [FRAME] "Delivery" #966:48263 layout={"mode":"column","alignSelf":"stretch","padding":"0px 40px","alignItems":"stretch","gap":"32px","sizing":{"horizontal":"fill","vertical":"hug"}}
      [FRAME] "Cards" #966:48264 layout={"mode":"row","alignSelf":"stretch","alignItems":"stretch","gap":"20px","sizing":{"horizontal":"fill","vertical":"hug"}}
        [FRAME] "Moscow" #966:48265 template=EL-8d2f7a65
          [TEXT] #966:48266 layout=layout_177c5efc fills=fill_34dc0314 textStyle=H3 text="Москва"
          [TEXT] #966:48267 layout={"mode":"none","sizing":{"horizontal":"fixed","vertical":"hug"},"dimensions":{"width":527.46}} fills=fill_95f554d6 textStyle=style_7144fd46 text="После доставки изделия к нам на склад, наш менеджер связывается с вами и согласовывает дату и время доставки"
          [TEXT] #966:48268 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_7144fd46 text="  - Доставка бесплатная"
        [FRAME] "Other" #966:48269 template=EL-8d2f7a65
          [TEXT] #966:48270 layout=layout_177c5efc fills=fill_34dc0314 textStyle=H3 text="Россия и зарубежье"
          [TEXT] #966:48271 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_7144fd46 boldWeight=700 text="Доставка осуществляется удобной для покупателя транспортной компанией по её тарифам. Сроки доставки зависят от поставки товара, бренда и адреса получения и согласовываются с менеджером.\\n{ts2}**Обратите внимание:**{/ts2} при отказе от товара стоимость доставки оплачивается покупателем."
    [FRAME] "In stock" #966:48272 layout={"mode":"row","alignSelf":"stretch","padding":"70px 0px","alignItems":"center","sizing":{"horizontal":"fill","vertical":"hug"}}
      [FRAME] #966:48273 layout={"mode":"column","alignSelf":"stretch","padding":"0px 20px 0px 40px","justifyContent":"flex-end","gap":"24px","sizing":{"horizontal":"fill","vertical":"fill"}}
        [FRAME] #966:48274 layout={"mode":"column","alignItems":"center","gap":"16px","sizing":{"horizontal":"hug","vertical":"hug"}}
          [TEXT] #966:48275 layout={"mode":"none","sizing":{"horizontal":"fixed","vertical":"hug"},"dimensions":{"width":658}} fills=fill_34dc0314 textStyle={"fontFamily":"Hauora","fontStyle":"Regular","fontWeight":400,"fontSize":18,"lineHeight":"1.25em","letterSpacing":"-0.02em","textAlignHorizontal":"LEFT","textAlignVertical":"TOP","paragraphSpacing":14,"listSpacing":14} text="Все изделия оформляются под заказ, поэтому при оформлении необходимо внести предоплату в размере 30% стоимости изделия . При оформлении заказа заключается официальный договор.\\nСрок поставки зависит от бренда и обычно составляет  от 2 недель до 2 месяцев. Точные сроки менеджер сообщит  при оформлении заказа."
        [FRAME] #966:48276 layout={"mode":"row","justifyContent":"center","alignItems":"center","gap":"12px","sizing":{"horizontal":"fixed","vertical":"hug"},"position":"absolute","locationRelativeToParent":{"x":40,"y":-20},"dimensions":{"width":674}}
