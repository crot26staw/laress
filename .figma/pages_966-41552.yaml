  fills: fill_34dc0314
EL-6291fe56:
  type: TEXT
  layout: layout_de0cc672
  text: "Hermès начался в\_1837\_году в\_Париже с\_мастерской конской упряжи\_— Тьерри Эрмес шил\_сёдла и\_сбрую для\_тех, кто\_ездил в\_экипажах. Отсюда и\_логотип с\_каретой, и\_главный принцип дома: вещь должна служить долго и\_делаться руками. Когда экипажи сменились автомобилями, семья не\_стала цепляться за\_прошлое, а\_перенесла то\_же\_качество на\_сумки, шёлк и\_предметы для\_дома. Дом\_до\_сих\_пор остаётся семейным\_— им\_управляет шестое поколение."
  textStyle: T2 (843:17364)
  fills: fill_95f554d6
EL-2ef4db81:
  type: TEXT
  layout: layout_de0cc672
  text: "Направление Hermès Maison\_— это\_фарфор, хрусталь, серебро и\_текстиль. Фарфор делают в\_Лиможе, роспись часто наносят вручную, а\_рисунки нередко приходят с\_шёлковых платков: те\_же\_лошади, якорные цепи, тропические листья, только на\_тарелке. Хрусталь дому даёт мануфактура Saint-Louis, работающая с\_1586\_года, серебро\_— Puiforcat. Логотипов на\_вещах почти нет: Hermès узнаётся по\_линии, цвету и\_тому, как\_предмет держишь в\_руке."
  textStyle: T2 (843:17364)
  fills: fill_95f554d6
