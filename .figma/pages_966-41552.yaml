        [TEXT] #966:47851 layout=layout_7d619cba fills=fill_95f554d6 textStyle=style_a562ea44 text="Сертификат можно использовать для единовременной покупки товаров из ассортимента Luvr.\\nЕсли сумма покупки больше номинала, разницу можно доплатить. Если сумма покупки меньше номинала, остаток не возвращается.\\nСертификат нельзя обменять на деньги или вернуть. Товар, оплаченный сертификатом, не подлежит возврату и обмену.\\nПовреждённая карта принимается только после подтверждения покупки.\\nДисконтная программа на покупку сертификата не распространяется."