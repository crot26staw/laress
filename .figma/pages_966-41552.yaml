        [FRAME] #966:46912 template=EL-1519dabc
          [TEXT] #966:46913 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_78a0c2e2 text="Подушка Cartier Panthere, 50×50см \\(15256\\) — это не просто элемент декора, а настоящее произведение искусства, соединяющее наследие знаменитого ювелирного дома с современными представлениями о комфорте. Созданная в духе культовой линии Panthere, она несёт в себе дух парижской элегантности и утончённого вкуса, превращая любой уголок дома в пространство роскоши.\\nИзделие выполнено из кашемира — материала, который по праву считается эталоном мягкости и комфорта. Кашемир дарит исключительную нежность на ощупь, обладает превосходными терморегулирующими свойствами и гипоаллергенностью. Благодаря высокой плотности плетения ткань сохраняет форму, а её тактильные качества вызывают настоящее удовольствие при каждом прикосновении. Наполнитель подушки подобран так, чтобы обеспечить оптимальную поддержку головы и шеи, делая её подходящей как для дневного отдыха, так и для полноценного сна.\\nКомпактные размеры \\(50×50 см\\) делают подушку универсальной: она отлично вписывается в любой интерьер, будь то спальня, гостиная или зона отдыха. Её можно разместить на диване, кресле, кровати или даже использовать в автомобиле для длительных поездок. Благодаря продуманным пропорциям подушка гармонично сочетается с другими элементами декора и не перегружает пространство.\\nДизайн подушки вдохновлён культовым мотивом Panthere — символом Cartier, воплощающим грацию, силу и независимость. Утончённый узор с изображением пантеры выполнен с ювелирной точностью, подчёркивая принадлежность к миру высокой моды. При этом орнамент деликатно вписан в общую композицию — он не выглядит навязчиво, а лишь добавляет изделию узнаваемый штрих и подчёркивает его премиальный статус."
      [FRAME] "Accord" #966:46914 template=EL-f844945e
        [LINE] #966:46915 template=EL-7d2050db
        [FRAME] #966:46916 template=EL-ba218cc4
          [FRAME] "Button" #966:46917 template=EL-f4418601
            [TEXT] #966:46918 template=EL-7124526e
            [IMAGE-SVG] #966:46919 template=EL-f652840d
          [TEXT] #966:46924 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_78a0c2e2 text="Перед продажей уточняем комплектацию изделия: оригинальную коробку, пакет, ленту, вкладыши, документы и другие детали.\\nПодготавливаем подарочную упаковку под изделие и повод."
        [LINE] #966:46925 template=EL-7d2050db
        [FRAME] #966:46926 template=EL-ba218cc4
          [FRAME] "Button" #966:46927 template=EL-f4418601
            [TEXT] #966:46928 layout=layout_56d3c81c fills=fill_34dc0314 textStyle=style_73856adf text="Подлинность изделий"
            [IMAGE-SVG] #966:46929 template=EL-f652840d
          [TEXT] #966:46934 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_78a0c2e2 text="Мы работаем с оригинальными изделиями премиальных брендов и проверенными поставщиками.\\nПо запросу менеджер может предоставить сертификат подлинности и объяснить отличия оригинального изделия от копии, чтобы вы могли спокойно принять решение перед покупкой.\\nДля сложных категорий возможна дополнительная проверка изделия у независимых экспертов."
        [LINE] #966:46935 template=EL-7d2050db
        [FRAME] #966:46936 template=EL-ba218cc4
          [FRAME] "Button" #966:46937 template=EL-f4418601
            [TEXT] #966:46938 layout=layout_56d3c81c fills=fill_34dc0314 textStyle=style_73856adf text="Доставка и оплата"
            [IMAGE-SVG] #966:46939 template=EL-f652840d
          [FRAME] #966:46944 template=EL-1519dabc
            [TEXT] #966:46945 layout=layout_56d3c81c fills=fill_95f554d6 textStyle=style_78a0c2e2 text="При наличии изделия в магазине доставка осуществляется в день оформления заказа.\\nЗаказы в регионы России и Зарубежья отправляем транспортной компанией. Все отправления застрахованы и тщательно упакованы. \\nЕсли товар повредится в пути, мы берем решение вопроса на себя и возвращаем вам средства.\\nОплата зависит от наличия товара: для позиций на складе возможна оплата при получении, для заказа под поставку — предоплата и официальный договор."
            [TEXT] #966:46946 layout=layout_56d3c81c fills=fill_34dc0314 textStyle=style_4e024b32 text="Подробнее о доставке и оплате"
        [LINE] #966:46947 template=EL-7d2050db
