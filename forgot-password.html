<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Восстановление пароля — Luvr</title>
    <meta name="robots" content="noindex" />
    <link rel="preload" href="/src/assets/fonts/hauora-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/hauora-medium.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module" src="/src/scripts/main.js"></script>
  </head>
  <body>
    <!-- «Забыли пароль?» — шаг 1 из 2 (по макету 966:49733, ошибка 966:49783). Восстановление по e-mail (решение пользователя 2026-11-18):
         e-mail → письмо со ссылкой → reset-password.html. В WordPress — lostpassword / retrieve_password().
         Ошибка сервера: «Пользователь с таким e-mail не зарегистрирован» (под полем). -->
    <main class="auth">
      <!-- @include src/partials/auth-media.html -->

      <section class="auth__panel" aria-labelledby="auth-title">
        <div class="auth__heading">
          <h1 class="text-h2 auth__title" id="auth-title">Забыли пароль?</h1>
          <p class="auth__intro">Укажите e-mail, с&nbsp;которым вы&nbsp;регистрировались, и&nbsp;мы&nbsp;пришлём ссылку для смены пароля</p>
        </div>

        <form class="auth__form" action="#" method="post" novalidate data-auth-form data-auth-success="email-sent">
          <!-- @include src/partials/text-field.html {"id": "forgot-email", "name": "email", "label": "E-mail", "type": "email", "autocomplete": "email"} -->
          <button class="button button--primary button--bold auth__submit" type="submit">Отправить ссылку</button>
        </form>

        <p class="auth__switch">Вспомнили пароль? <a class="auth__link" href="/login.html">Войти</a></p>
      </section>
    </main>

    <!-- @include src/partials/notice-modal.html {"id": "email-sent", "title": "Письмо отправлено", "text": "Перейдите по ссылке из письма, чтобы задать новый пароль", "button": "Ко входу", "href": "/login.html", "bold": true} -->
  </body>
</html>
