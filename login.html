<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход — Luvr</title>
    <meta name="robots" content="noindex" />
    <link rel="preload" href="/src/assets/fonts/hauora-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/hauora-medium.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module" src="/src/scripts/main.js"></script>
  </head>
  <body>
    <!-- Вход (966:49809, заполненный 966:49833, ошибка 966:49881). Отличия от макета (решение пользователя 2026-11-18):
         вход по e-mail вместо поля «ФИО», кнопка «Войти», ссылка «Забыли пароль?», без чекбокса согласия (он — в регистрации).
         Ошибки сервера: «Пользователя с таким e-mail не существует» (под e-mail), «Неверный пароль» (под паролем). -->
    <main class="auth">
      <!-- @include src/partials/auth-media.html -->

      <section class="auth__panel" aria-labelledby="auth-title">
        <h1 class="text-h2 auth__title" id="auth-title">Здравствуйте!</h1>

        <form class="auth__form" action="#" method="post" novalidate data-auth-form data-auth-redirect="/account.html">
          <!-- @include src/partials/text-field.html {"id": "login-email", "name": "email", "label": "E-mail", "type": "email", "autocomplete": "email"} -->
          <!-- @include src/partials/password-field.html {"id": "login-password", "name": "password", "label": "Пароль", "autocomplete": "current-password"} -->
          <a class="auth__forgot" href="/forgot-password.html">Забыли пароль?</a>
          <button class="button button--primary button--bold auth__submit" type="submit">Войти</button>
        </form>

        <p class="auth__switch">Нет аккаунта? <a class="auth__link" href="/register.html">Зарегистрироваться</a></p>
      </section>
    </main>
  </body>
</html>
