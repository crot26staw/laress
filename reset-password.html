<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Новый пароль — Luvr</title>
    <meta name="robots" content="noindex" />
    <link rel="preload" href="/src/assets/fonts/hauora-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/hauora-medium.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module" src="/src/scripts/main.js"></script>
  </head>
  <body>
    <!-- Новый пароль — шаг 2 из 2, открывается по ссылке из письма (по макету 966:49733, ошибка 966:49758 «Пароли не совпадают»).
         В WordPress — rp / reset_password(): в форму добавляются скрытые поля с логином и ключом из ссылки. -->
    <main class="auth">
      <!-- @include src/partials/auth-media.html -->

      <section class="auth__panel" aria-labelledby="auth-title">
        <div class="auth__heading">
          <h1 class="text-h2 auth__title" id="auth-title">Новый пароль</h1>
          <p class="auth__intro">Придумайте новый пароль для входа в&nbsp;личный кабинет</p>
        </div>

        <form class="auth__form" action="#" method="post" novalidate data-auth-form data-auth-success="password-changed">
          <!-- @include src/partials/password-field.html {"id": "reset-password", "name": "password", "label": "Пароль", "autocomplete": "new-password"} -->
          <!-- @include src/partials/password-field.html {"id": "reset-password-repeat", "name": "password_repeat", "label": "Повторите пароль", "autocomplete": "new-password", "repeat": "reset-password"} -->
          <button class="button button--primary button--bold auth__submit" type="submit">Сохранить пароль</button>
        </form>
      </section>
    </main>

    <!-- @include src/partials/notice-modal.html {"id": "password-changed", "title": "Пароль изменён", "text": "Теперь вы можете войти с новым паролем", "button": "Войти", "href": "/login.html", "bold": true} -->
  </body>
</html>
