<!-- Панель адреса доставки — «Добавление адреса» (966:41377 во фрейме 966:41349): поле с линией снизу и «очистить», кнопка внизу.
     Нативный <dialog class="drawer drawer--form">, открывается кнопкой [data-dialog-open="{{id}}"] (modules/drawer-form.js).
     Параметры: id, title, button, value (адрес для изменения), success (id окна, которое открыть после отправки).
     Добавление: «Добавление адреса» / «Добавить адрес», изменение: «Изменить адрес» / «Сохранить» (в макете только добавление, кнопка там «Изменить данные» — решение пользователя 2026-11-17).
     Станет template-parts/address-drawer.php. -->
<dialog class="drawer drawer--form" id="{{id}}" aria-labelledby="{{id}}-title">
  <div class="drawer__header">
    <h2 class="drawer__title" id="{{id}}-title">{{title}}</h2>
    <button class="drawer__close" type="button" aria-label="Закрыть" data-dialog-close>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 6L12 12M12 12L18 18M12 12L18 6M12 12L6 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      </svg>
    </button>
  </div>
  <form class="drawer__form" action="" method="post" data-drawer-form {{#if success}}data-drawer-success="{{success}}"{{/if}}>
    <div class="field field--line field--clearable">
      <label class="visually-hidden" for="{{id}}-address">Адрес доставки</label>
      <input class="field__input" type="text" id="{{id}}-address" name="address" value="{{value}}" placeholder="Введите адрес доставки" autocomplete="street-address" required />
      <button class="field__action" type="button" aria-label="Очистить поле" data-field-clear>
        <img src="/src/assets/icons/icon-clear.svg" width="16" height="16" alt="" />
      </button>
    </div>
    <button class="button button--primary drawer__submit" type="submit">{{button}}</button>
  </form>
</dialog>
