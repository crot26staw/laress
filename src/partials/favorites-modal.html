<!-- Окно «Добавление в избранное» (966:48692, наведение — 966:48984, без подборок — 966:48841) и «Создание подборки» (966:49284).
     Открывается сердечком на карточке товара (modules/wishlist.js), подключено в header.html — есть на всех страницах.
     Два вида в одной панели: список подборок [data-favorites-view="list"] и форма [data-favorites-view="create"].
     Станет template-parts/favorites-modal.php: строки списка — цикл по подборкам пользователя. -->
<dialog class="modal favorites-modal" id="favorites-modal" aria-labelledby="favorites-modal-title">
  <div class="modal__panel favorites-modal__panel" data-dialog-panel>
    <div class="favorites-modal__view" data-favorites-view="list">
      <div class="favorites-modal__content">
        <div class="favorites-modal__head">
          <h2 class="favorites-modal__title" id="favorites-modal-title">Добавление в избранное</h2>
          <button class="favorites-modal__close" type="button" aria-label="Закрыть" data-dialog-close>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
          </button>
        </div>
        <ul class="favorites-modal__list" data-favorites-list>
          <li class="favorites-modal__item">
            <span class="favorites-modal__name">Все сохраненные</span>
            <button class="button button--tertiary favorites-modal__add" type="button" aria-label="Добавить в «Все сохраненные»" data-favorites-add>Добавить</button>
          </li>
          <li class="favorites-modal__item">
            <span class="favorites-modal__name">Сервировка для ужина</span>
            <button class="button button--tertiary favorites-modal__add" type="button" aria-label="Добавить в подборку «Сервировка для ужина»" data-favorites-add>Добавить</button>
          </li>
          <li class="favorites-modal__item">
            <span class="favorites-modal__name">Проект гостиной</span>
            <button class="button button--tertiary favorites-modal__add" type="button" aria-label="Добавить в подборку «Проект гостиной»" data-favorites-add>Добавить</button>
          </li>
        </ul>
      </div>
      <div class="favorites-modal__actions">
        <button class="button button--primary" type="button" data-favorites-create>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 0.73V8M8 8V15.27M8 8H15.27M8 8H0.73" stroke="currentColor" stroke-width="1.46" stroke-linecap="round" /></svg>
          <span class="favorites-modal__create-label">Создать подборку</span>
          <span class="favorites-modal__empty-label" hidden>Создать</span>
        </button>
      </div>
    </div>

    <form class="favorites-modal__view" data-favorites-view="create" hidden>
      <div class="favorites-modal__content favorites-modal__content--form">
        <div class="favorites-modal__head">
          <button class="favorites-modal__back" type="button" data-favorites-back>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 13.28L5.65 8.93C5.14 8.42 5.14 7.58 5.65 7.07L10 2.72" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
            Назад
          </button>
          <button class="favorites-modal__close favorites-modal__close--form" type="button" aria-label="Закрыть" data-dialog-close hidden>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
          </button>
        </div>
        <h2 class="favorites-modal__title" id="favorites-modal-create-title">Создание подборки</h2>
        <label class="field field--outline">
          <span class="visually-hidden">Название подборки</span>
          <input class="field__input" type="text" name="collection-name" placeholder="Название" autocomplete="off" required />
        </label>
      </div>
      <div class="favorites-modal__actions favorites-modal__actions--form">
        <button class="button button--primary" type="submit">Создать</button>
      </div>
    </form>
  </div>
</dialog>
