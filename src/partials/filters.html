<!-- Панель фильтров каталога — «Каталог / Фильтры Все» (966:42754), «Каталог / Фильтры на одном экране» (966:42996).
     Нативный <dialog>: открывается кнопкой [data-filters-open], закрывается крестиком, Esc и кликом по затемнению.
     Форма — обычный GET, значения фильтров приходят в адрес страницы (обработает WordPress). -->
<dialog class="filters" id="filters" aria-labelledby="filters-title" data-filters>
  <form class="filters__form" method="get" action="">
    <div class="filters__content">
      <div class="filters__header">
        <h2 class="filters__title" id="filters-title">Фильтры</h2>
        <button class="filters__close" type="button" aria-label="Закрыть фильтры" data-filters-close>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 6L12 12M12 12L18 18M12 12L18 6M12 12L6 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <fieldset class="filters__group">
        <legend class="filters__legend">Категории</legend>
        <ul class="filters__options">
          <li><label class="choice"><input class="choice__input" type="checkbox" name="category" value="tableware" /><span class="choice__label">Посуда</span></label></li>
          <li><label class="choice"><input class="choice__input" type="checkbox" name="category" value="decor" /><span class="choice__label">Декор и интерьер</span></label></li>
          <li><label class="choice"><input class="choice__input" type="checkbox" name="category" value="accessories" /><span class="choice__label">Аксессуары</span></label></li>
          <li><label class="choice"><input class="choice__input" type="checkbox" name="category" value="textile" /><span class="choice__label">Текстиль</span></label></li>
        </ul>
      </fieldset>

      <fieldset class="filters__group">
        <legend class="filters__legend">Бренды</legend>
        <ul class="filters__options">
          <li><label class="choice"><input class="choice__input" type="checkbox" name="brand" value="hermes" /><span class="choice__label">Hermès</span></label></li>
          <li><label class="choice"><input class="choice__input" type="checkbox" name="brand" value="baccarat" /><span class="choice__label">Baccarat</span></label></li>
          <li><label class="choice"><input class="choice__input" type="checkbox" name="brand" value="lalique" /><span class="choice__label">Lalique</span></label></li>
          <li><label class="choice"><input class="choice__input" type="checkbox" name="brand" value="daum" /><span class="choice__label">Daum</span></label></li>
          <li><a class="filters__more" href="/brands.html">Посмотреть все</a></li>
        </ul>
      </fieldset>

      <fieldset class="filters__group">
        <legend class="filters__legend">Цена</legend>
        <div class="filters__price">
          <div class="filters__range">
            <label class="visually-hidden" for="filters-price-min">Цена от, ₽</label>
            <input class="filters__input" id="filters-price-min" type="text" name="price_min" inputmode="numeric" placeholder="10 000" autocomplete="off" />
            <span class="filters__range-dash" aria-hidden="true"></span>
            <label class="visually-hidden" for="filters-price-max">Цена до, ₽</label>
            <input class="filters__input" id="filters-price-max" type="text" name="price_max" inputmode="numeric" placeholder="10 000 000" autocomplete="off" />
          </div>
          <ul class="filters__options">
            <li><label class="choice"><input class="choice__input choice__input--radio" type="radio" name="price" value="0-500000" /><span class="choice__label">До 500&nbsp;000&nbsp;₽</span></label></li>
            <li><label class="choice"><input class="choice__input choice__input--radio" type="radio" name="price" value="0-1000000" /><span class="choice__label">До 1&nbsp;000&nbsp;000&nbsp;₽</span></label></li>
            <li><label class="choice"><input class="choice__input choice__input--radio" type="radio" name="price" value="0-2000000" /><span class="choice__label">До 2&nbsp;000&nbsp;000&nbsp;₽</span></label></li>
            <li><label class="choice"><input class="choice__input choice__input--radio" type="radio" name="price" value="2000000-" /><span class="choice__label">От 2&nbsp;000&nbsp;000&nbsp;₽</span></label></li>
          </ul>
        </div>
      </fieldset>

      <fieldset class="filters__group">
        <legend class="filters__legend">Тип изделия</legend>
        <ul class="filters__options">
          <li><label class="choice"><input class="choice__input" type="checkbox" name="type" value="plates" /><span class="choice__label">Тарелки</span></label></li>
          <li><label class="choice"><input class="choice__input" type="checkbox" name="type" value="sets" /><span class="choice__label">Сервизы</span></label></li>
          <li><label class="choice"><input class="choice__input" type="checkbox" name="type" value="glasses" /><span class="choice__label">Бокалы</span></label></li>
          <li><label class="choice"><input class="choice__input" type="checkbox" name="type" value="vases" /><span class="choice__label">Вазы</span></label></li>
          <!-- Остальные значения WordPress выведет скрытыми (li hidden data-filters-extra), «Посмотреть все» их раскроет -->
          <li><button class="filters__more" type="button" aria-expanded="false" data-filters-more>Посмотреть все</button></li>
        </ul>
      </fieldset>

      <fieldset class="filters__group">
        <legend class="filters__legend">Материал</legend>
        <ul class="filters__options">
          <li><label class="choice"><input class="choice__input" type="checkbox" name="material" value="porcelain" /><span class="choice__label">Фарфор</span></label></li>
          <li><label class="choice"><input class="choice__input" type="checkbox" name="material" value="crystal" /><span class="choice__label">Хрусталь</span></label></li>
          <li><label class="choice"><input class="choice__input" type="checkbox" name="material" value="glass" /><span class="choice__label">Стекло</span></label></li>
          <li><label class="choice"><input class="choice__input" type="checkbox" name="material" value="silver" /><span class="choice__label">Серебро</span></label></li>
          <li><button class="filters__more" type="button" aria-expanded="false" data-filters-more>Посмотреть все</button></li>
        </ul>
      </fieldset>
    </div>

    <div class="filters__actions">
      <button class="button button--primary" type="submit">Показать</button>
      <button class="button button--tertiary filters__reset" type="reset">Сбросить</button>
    </div>
  </form>
</dialog>
