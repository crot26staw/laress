<div class="announcement" data-announcement>
  <p class="announcement__text">Бесплатная доставка по Москве при заказе от 30.000 рублей</p>
  <button class="announcement__close" type="button" aria-label="Закрыть объявление" data-announcement-close>
    <svg class="announcement__close-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M6 6L12 12M12 12L18 18M12 12L18 6M12 12L6 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    </svg>
  </button>
</div>

<header class="header header--transparent">
  <div class="header__top">
    <div class="header__group header__group--start">
      <div class="header__lang">
        <a class="header__lang-link" href="#" hreflang="en" lang="en">US</a><span class="header__lang-separator" aria-hidden="true">/</span><a class="header__lang-link header__lang-link--active" href="#" hreflang="ru" aria-current="true">RU</a>
      </div>
      <button class="header__currency" type="button" aria-haspopup="true" aria-expanded="false">
        RUB
        <svg class="header__currency-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M2.004 4.004L5.294 7.294C5.682 7.682 6.318 7.682 6.706 7.294L9.996 4.004" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.009" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <a class="header__logo" href="/" aria-label="Luvr — на главную">
      <picture>
        <source srcset="/src/assets/images/common/logo-full.webp" type="image/webp" />
        <img class="header__logo-image" src="/src/assets/images/common/logo-full.png" width="118" height="34" alt="Luvr" />
      </picture>
    </a>

    <div class="header__group header__group--end">
      <a class="header__icon-link" href="#" aria-label="Поиск по каталогу">

      </a>
      <a class="header__icon-link" href="#" aria-label="Избранное">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3.21688 13.1999C1.05354 10.2665 1.77465 5.86642 5.38022 4.39973C8.98579 2.93305 11.1491 5.86642 11.8702 7.33311C12.5914 5.86642 15.4758 2.93305 19.0814 4.39973C22.687 5.86642 22.687 10.2665 20.5236 13.1999C18.3603 16.1332 11.8702 22 11.8702 22C11.8702 22 5.38022 16.1332 3.21688 13.1999Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
        </svg>

      <a class="button button--s button--tertiary-white header__login" href="#">Войти</a>
    </div>
  </div>

  <nav class="header__nav" aria-label="Основное меню">
    <ul class="header__menu">
      <li class="header__menu-item"><a class="header__menu-link" href="#">Подарки</a></li>
      <li class="header__menu-item"><a class="header__menu-link" href="#">В наличии</a></li>

      <li class="header__menu-item"><a class="header__menu-link" href="#">Посуда</a></li>
      <li class="header__menu-item"><a class="header__menu-link" href="#">Декор и интерьер</a></li>
