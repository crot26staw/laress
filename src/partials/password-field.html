<!-- Поле пароля «Input-password» (966:41164 / 966:41190): плавающая подпись, точки вместо символов,
     кнопки «очистить» и «показать пароль» (видны, когда поле заполнено; логика — modules/password-field.js).
     Параметры: id, name, label, autocomplete, error (текст ошибки — состояние «ошибка», 966:41216),
     repeat — id поля, с которым пароль должен совпадать (проверка — modules/auth-form.js). -->
<div class="form-field {{#if error}}form-field--invalid{{/if}}">
  <div class="field field--float field--password" data-password-field>
    <div class="field__body">
      <input class="field__input" type="password" id="{{id}}" name="{{name}}" placeholder=" " autocomplete="{{autocomplete}}" required {{#if repeat}}data-password-repeat="{{repeat}}"{{/if}} {{#if error}}aria-invalid="true" aria-describedby="{{id}}-error"{{/if}} />
      <label class="field__label" for="{{id}}">{{label}}</label>
    </div>
    <div class="field__actions">
      <button class="field__action" type="button" aria-label="Очистить поле" data-password-clear>
        <img src="/src/assets/icons/icon-close-circle.svg" width="16" height="16" alt="" />
      </button>
      <span class="field__divider" aria-hidden="true"></span>
      <button class="field__action" type="button" aria-label="Показать пароль" aria-pressed="false" data-password-toggle>
        <img src="/src/assets/icons/icon-eye.svg" width="16" height="16" alt="" />
      </button>
    </div>
  </div>
  {{#if error}}<p class="form-field__error" id="{{id}}-error">{{error}}</p>{{/if}}
</div>
