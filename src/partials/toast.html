<!-- Уведомление «Modal / Toast» (966:41300): чёрная плашка 397px справа внизу, закрывается крестиком (modules/toast.js).
     Параметры: title, text. Показывается снятием hidden (после успешной отправки формы). -->
<div class="toast" role="status" hidden data-toast>
  <p class="text-h3 toast__title">{{title}}</p>
  <p class="toast__text">{{text}}</p>
  <button class="toast__close" type="button" aria-label="Закрыть уведомление" data-toast-close>
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="2" d="M14.22 14.22 29.78 29.78M29.78 14.22 14.22 29.78" /></svg>
  </button>
</div>
